<!doctype html>
<html lang="{{.Lang}}" data-theme="{{.Theme}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>automaty.cell</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
  /* Themes (?theme=…): bonbon (default) and arcade, both 8-bit. */
  :root {
    --bg: #1a1024;
    --panel: #2a1a3a;
    --line: #4d3366;
    --stars: #2f1f42;
    --text: #fff5fb;
    --muted: #cdb4db;
    --legend: #a0e7e5;
    --primary: #ffafcc;
    --primary-text: #1a1024;
    --highlight: #fdffb6;
    --link: #a0e7e5;
    --error: #ff6b6b;
    --border: 2px;
    --radius: 0;
    --radius-small: 0;
    --font: 18px/1.15 'VT323', monospace;
    --small: 15px;
    --pixel: 'Press Start 2P', monospace;
  }
  [data-theme=arcade] {
    --bg: #0b0b1e;
    --panel: #16163a;
    --line: #3b3b7a;
    --stars: #23234d;
    --text: #f0f0ff;
    --muted: #a9a9d6;
    --legend: #4de3ff;
    --primary: #ff4fa3;
    --primary-text: #0b0b1e;
    --highlight: #ffe14d;
    --link: #4de3ff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: var(--font);
  }
  body {
    background-image: radial-gradient(var(--line) 1px, transparent 1.5px), radial-gradient(var(--stars) 1px, transparent 1.5px);
    background-size: 48px 48px, 23px 23px;
    background-position: 0 0, 11px 7px;
  }
  .page {
    display: flex;
    flex-direction: column;
    gap: 16px;
    padding: 16px;
    max-width: 1400px;
    margin: 0 auto;
  }
  main {
    display: grid;
    grid-template-columns: 320px 1fr;
    gap: 16px;
    align-items: start;
  }
  @media (max-width: 800px) { main { grid-template-columns: 1fr; } }
  form { display: flex; flex-direction: column; gap: 12px; }
  fieldset {
    margin: 0;
    padding: 10px 12px 12px;
    border: var(--border) solid var(--line);
    border-radius: var(--radius);
    background: var(--panel);
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr)); /* columns may shrink below their fields' natural width */
    gap: 8px 10px;
    min-width: 0;
  }
  legend { padding: 0 6px; color: var(--legend); font-weight: 600; }
  label { display: flex; flex-direction: column; gap: 3px; color: var(--muted); font-size: var(--small); }
  label.wide, .wide { grid-column: 1 / -1; }
  label.check { flex-direction: row; align-items: center; gap: 6px; }
  input, select, button {
    font: inherit;
    color: var(--text);
    background: var(--bg);
    border: var(--border) solid var(--line);
    border-radius: var(--radius-small);
    padding: 5px 7px;
    min-width: 0;
  }
  label > input, label > select, .row > input { width: 100%; }
  input[type=checkbox], input[type=radio] { width: auto; padding: 0; accent-color: var(--primary); }
  input[type=color] { padding: 1px; height: 30px; width: 100%; }
  input[type=range] { padding: 0; accent-color: var(--highlight); }
  button { cursor: pointer; }
  button:hover { border-color: var(--primary); }
  #surprise {
    padding: 10px;
    font-weight: 600;
    font-size: 15px;
    background: var(--primary);
    color: var(--primary-text);
    border-color: var(--primary);
  }
  #surprise:hover { filter: brightness(1.1); }
  #surprise:disabled { opacity: 0.6; cursor: wait; }
  .row { display: flex; gap: 6px; }
  .row > :first-child { flex: 1; }
  .modes { display: flex; gap: 14px; }
  [hidden] { display: none !important; }

  /* Symmetry as four "power-up" buttons: radios under their labels. */
  .powers { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
  .powers label { position: relative; display: block; }
  .powers input { position: absolute; opacity: 0; }
  .powers span {
    display: block;
    padding: 6px 0;
    text-align: center;
    color: var(--primary);
    border: var(--border) solid var(--primary);
    border-radius: var(--radius-small);
    cursor: pointer;
  }
  .powers input:checked + span { background: var(--primary); color: var(--primary-text); }
  .powers input:focus-visible + span { outline: 2px solid var(--highlight); outline-offset: 2px; }
  .hint { margin: 0; color: var(--highlight); font-size: var(--small); }
  #palette-preview { display: block; height: 8px; border: var(--border) solid var(--line); }
  .colors { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; margin-bottom: 6px; }
  .colors input { width: 100%; height: 30px; padding: 1px; }
  #color-add, #color-remove { flex: 1; }

  /* The warning sits in the header, between the name and the pickers, on
     one line as tall as them; the full text is in its tooltip. */
  #warning {
    flex: 1;
    min-width: 0;
    align-self: stretch;
    display: flex;
    gap: 10px;
    align-items: center;
    padding: 0 4px 0 10px;
    background: var(--bg);
    border: 2px solid var(--highlight);
    box-shadow: 3px 3px 0 var(--primary);
  }
  #warning p { margin: 0; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #warning strong { margin-right: 8px; color: var(--highlight); }
  #warning button { flex-shrink: 0; background: var(--highlight); color: var(--primary-text); border: 0; padding: 4px 8px; }
  @media (max-width: 800px) {
    header { flex-wrap: wrap; }
    #warning { order: 1; flex-basis: 100%; min-height: 36px; }
  }

  header { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  header h1 { margin: 0; font-size: 18px; }
  header label { flex-direction: row; align-items: center; gap: 8px; }
  .pickers { display: flex; gap: 14px; }
  header h1 { font-family: var(--pixel); font-size: 14px; font-weight: 400; color: var(--text); text-shadow: 3px 3px 0 var(--primary); }

  #view { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  #frame {
    position: relative;
    display: grid;
    place-items: center;
    min-height: 300px;
    background: var(--panel);
    border: var(--border) solid var(--line);
    border-radius: var(--radius);
    padding: 12px;
  }
  #frame img { max-width: 100%; height: auto; image-rendering: pixelated; }
  #frame img { border: 3px solid var(--highlight); box-shadow: 6px 6px 0 var(--primary); max-width: calc(100% - 6px); max-height: calc(100% - 6px); }
  #status {
    position: absolute; top: 10px; right: 12px;
    color: var(--muted); font-size: var(--small);
  }
  #error { color: var(--error); white-space: pre-wrap; }
  #cmd {
    display: flex; gap: 8px; align-items: center;
    background: var(--panel); border: var(--border) solid var(--line); border-radius: var(--radius); padding: 8px 10px;
  }
  #cmd code { flex: 1; overflow-x: auto; white-space: nowrap; font-size: 13px; }
  #cmd a { color: var(--link); }

  /* 8-bit type: pixel font for titles and the big button. */
  legend,
  #warning strong,
  #warning button,
  .powers span { font-family: var(--pixel); font-size: 9px; font-weight: 400; text-transform: uppercase; line-height: 1.6; }
  #surprise { font-family: var(--pixel); font-size: 12px; font-weight: 400; box-shadow: 4px 4px 0 var(--highlight); }
  #cmd code { font: var(--font); color: var(--highlight); }
  label input,
  label select { font-size: 18px; }
  /* Desktop: everything fits in one screen. The image shrinks to the space
     left, and the settings scroll inside their column on short screens. */
  @media (min-width: 801px) {
    .page { height: 100vh; height: 100dvh; }
    main { flex: 1; min-height: 0; grid-template-rows: minmax(0, 1fr); align-items: stretch; }
    form { min-height: 0; overflow-y: auto; scrollbar-width: thin; }
    #view { min-height: 0; }
    #frame { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
    #frame img { max-height: 100%; width: auto; object-fit: contain; }
  }
</style>
</head>
<body>
<div class="page">
<header>
  <h1>automaty.cell</h1>
  <section id="warning" aria-label="{{.T.warningLabel}}" title="{{.T.warningText}}">
    <p><strong>{{.T.warningLabel}}</strong>{{.T.warningShort}}</p>
    <button type="button" id="warning-ok">{{.T.close}}</button>
  </section>
  <div class="pickers">
    <label>{{.T.theme}}
      <select id="theme">
        <option value="bonbon"{{if eq .Theme "bonbon"}} selected{{end}}>{{.T.themeCandy}}</option>
        <option value="arcade"{{if eq .Theme "arcade"}} selected{{end}}>{{.T.themeArcade}}</option>
      </select>
    </label>
    <label>{{.T.language}}
      <select id="lang">
        <option value="en"{{if eq .Lang "en"}} selected{{end}}>English</option>
        <option value="fr"{{if eq .Lang "fr"}} selected{{end}}>Français</option>
      </select>
    </label>
  </div>
</header>

<main>
<form id="form" autocomplete="off">
  <button type="button" id="surprise" title="{{.T.randomTitle}}">? RANDOM</button>
  <fieldset>
    <legend>{{.T.automaton}}</legend>
    <div class="modes wide">
      <label class="check"><input type="radio" name="mode" value="rule" checked> {{.T.modeRule}}</label>
      <label class="check"><input type="radio" name="mode" value="cyclic"> {{.T.modeCyclic}}</label>
    </div>

    <label class="wide" data-mode="rule">{{.T.preset}}
      <select id="preset">
        <option value="">{{.T.customRule}}</option>
        {{range .Presets}}<option value="{{.Name}}">{{.Name}} ({{.Rule}})</option>
        {{end}}
      </select>
    </label>
    <label class="wide" data-mode="rule">{{.T.rule}}
      <input name="rule" value="B3/S23">
    </label>

    <label class="wide" data-mode="cyclic">{{.T.preset}}
      <select id="cyclic-preset">
        <option value="">{{.T.custom}}</option>
        <option value="3,3,moore,1">{{.T.roundSpirals}} (3 / 3 / Moore / 1)</option>
        <option value="4,3,moore,1">{{.T.waves}} (4 / 3 / Moore / 1)</option>
        <option value="8,5,moore,3">{{.T.bigSpirals}} (8 / 5 / Moore / 3)</option>
        <option value="14,1,vonneumann,1">{{.T.squareSpirals}} (14 / 1 / Von Neumann / 1)</option>
        <option value="6,2,vonneumann,2">{{.T.maze}} (6 / 2 / Von Neumann / 2)</option>
      </select>
    </label>
    <label data-mode="cyclic">{{.T.states}} <input name="states" type="number" min="2" max="256" value="14"></label>
    <label data-mode="cyclic">{{.T.threshold}} <input name="threshold" type="number" min="1" value="1"></label>
    <label data-mode="cyclic">{{.T.neighbourhood}}
      <select name="neighborhood">
        <option value="moore">{{.T.moore}}</option>
        <option value="vonneumann" selected>{{.T.vonNeumann}}</option>
      </select>
    </label>
    <label data-mode="cyclic">{{.T.radius}} <input name="radius" type="number" min="1" value="1"></label>
    <p id="cyclic-hint" class="wide hint" hidden>{{.T.cyclicHint}}</p>
  </fieldset>

  <fieldset>
    <legend>{{.T.colours}}</legend>
    <label class="wide">{{.T.palette}}
      <select name="palette">
        {{range .Palettes}}<option data-gradient="{{.CSS}}"{{if eq .Name "age"}} selected{{end}}>{{.Name}}</option>{{end}}
      </select>
      <span id="palette-preview" aria-hidden="true"></span>
    </label>
    <label class="check wide"><input type="checkbox" id="custom"> {{.T.customGradient}}</label>
    <div class="wide" data-custom>
      <div id="colors" class="colors"></div>
      <div class="row"><button type="button" id="color-add">{{.T.addColour}}</button><button type="button" id="color-remove">{{.T.removeColour}}</button></div>
    </div>
  </fieldset>

  <fieldset>
    <legend>{{.T.start}}</legend>
    <label class="wide">Seed
      <span class="row"><input name="seed" type="number" value="1"><button type="button" id="dice" aria-label="{{.T.randomSeed}}" title="{{.T.randomSeed}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="18" height="18"></rect><rect x="7" y="7" width="2" height="2" fill="currentColor"></rect><rect x="15" y="15" width="2" height="2" fill="currentColor"></rect><rect x="11" y="11" width="2" height="2" fill="currentColor"></rect></svg></button></span>
    </label>
    <div class="wide"><span id="symmetry-label" style="display:block; margin-bottom:3px; color:var(--muted); font-size:var(--small)">{{.T.symmetry}}</span>
      <div class="powers" role="radiogroup" aria-labelledby="symmetry-label">
        <label><input type="radio" name="symmetry" value="1" checked><span>×1</span></label>
        <label title="{{.T.mirror}}"><input type="radio" name="symmetry" value="2"><span>×2</span></label>
        <label title="{{.T.mirror}}"><input type="radio" name="symmetry" value="4"><span>×4</span></label>
        <label title="{{.T.mirror}}, {{.T.squareOnly}}"><input type="radio" name="symmetry" value="8"><span>×8</span></label>
        <label title="{{.T.halfTurn}}"><input type="radio" name="symmetry" value="r2"><span>R2</span></label>
        <label title="{{.T.quarterTurns}}, {{.T.squareOnly}}"><input type="radio" name="symmetry" value="r4"><span>R4</span></label>
      </div>
    </div>
    <label class="wide">{{.T.shape}}
      <select name="shape">
        <option value="all">{{.T.shapeAll}}</option>
        <option value="disc">{{.T.shapeDisc}}</option>
        <option value="ring">{{.T.shapeRing}}</option>
        <option value="cross">{{.T.shapeCross}}</option>
        <option value="frame">{{.T.shapeFrame}}</option>
        <option value="stripes">{{.T.shapeStripes}}</option>
      </select>
    </label>
    <label class="wide" data-mode="rule">{{.T.density}} : <output id="density-out">0.3</output>
      <input name="density" type="range" min="0" max="1" step="0.01" value="0.3">
    </label>
  </fieldset>

  <fieldset>
    <legend>{{.T.output}}</legend>
    <label>Format
      <select id="format">
        <option value="png">{{.T.pngLast}}</option>
        <option value="gif">{{.T.gifAnimated}}</option>
      </select>
    </label>
    <label>{{.T.generations}} <input name="gens" type="number" min="1" max="{{.MaxGens}}" value="100"></label>
    <label data-format="gif">{{.T.delay}} <input name="delay" type="number" min="0" value="5"></label>
    <label class="check wide" data-format="gif"><input name="pingpong" type="checkbox"> {{.T.pingpong}}</label>
  </fieldset>

  <fieldset>
    <legend>{{.T.grid}}</legend>
    <label>{{.T.width}} <input name="w" type="number" min="30" max="{{.MaxSide}}" step="50" value="380"></label>
    <label>{{.T.height}} <input name="h" type="number" min="30" max="{{.MaxSide}}" step="50" value="380"></label>
    <label>{{.T.scale}} <input name="scale" type="number" min="1" max="{{.MaxScale}}" value="2"></label>
    <label class="check" style="align-self:end"><input name="wrap" type="checkbox" checked> {{.T.wrap}}</label>
  </fieldset>
</form>

<section id="view">
  <div id="frame">
    <span id="status"></span>
    <img id="img" alt="{{.T.renderAlt}}">
    <div id="error" hidden></div>
  </div>
  <div id="cmd">
    <code id="cmdline"></code>
    <button type="button" id="copy">{{.T.copyCommand}}</button>
    <button type="button" id="link">{{.T.copyLink}}</button>
    <a id="download" download>{{.T.download}}</a>
  </div>
</section>
</main>
</div>

<script>
const form = document.getElementById('form');
const $ = id => document.getElementById(id);
// Kept in the page's own URL so a shared link opens in the same theme and language.
const theme = new URLSearchParams(location.search).get('theme');
const lang = new URLSearchParams(location.search).get('lang');
const T = {{.T}}; // the page's words, for the few the script writes itself
// Cyclic settings known to keep moving ("neighborhood,radius,states,threshold").
const LIVELY = new Set({{.Lively}});

const mode = () => form.mode.value;
const format = () => $('format').value;
const custom = () => $('custom').checked;
// The custom gradient's colours, as #rrggbb, from 2 to 8 of them.
const colors = () => [...$('colors').querySelectorAll('input')].map(i => i.value);

function setColors(list) {
  $('colors').replaceChildren(...list.map((c, i) => {
    const input = document.createElement('input');
    input.type = 'color';
    input.value = c.startsWith('#') ? c : '#' + c;
    input.setAttribute('aria-label', T.jsColour + ' ' + (i + 1));
    return input;
  }));
  $('color-add').disabled = list.length >= 8;
  $('color-remove').disabled = list.length <= 2;
}

// Show only the fields that apply to the current mode, format and palette.
function updateVisibility() {
  for (const el of form.querySelectorAll('[data-mode]')) el.hidden = el.dataset.mode !== mode();
  for (const el of form.querySelectorAll('[data-format]')) el.hidden = el.dataset.format !== format();
  for (const el of form.querySelectorAll('[data-custom]')) el.hidden = !custom();
  form.palette.disabled = custom();
  const cyc = [form.neighborhood.value, form.radius.value, form.states.value, form.threshold.value].join(',');
  $('cyclic-hint').hidden = mode() !== 'cyclic' || LIVELY.has(cyc);
  $('density-out').value = form.density.value;
  $('palette-preview').style.background = custom()
    ? `linear-gradient(90deg, ${colors().join(', ')})`
    : form.palette.selectedOptions[0].dataset.gradient;
}

// The options to send, as [flag, value, isDefault]; hidden fields are skipped.
function options() {
  const opts = [];
  if (mode() === 'cyclic') opts.push(['cyclic', 'true', false]);
  for (const el of form.elements) {
    if (!el.name || el.name === 'mode' || el.disabled || el.closest('[hidden]')) continue;
    if (el.type === 'radio') {
      if (el.checked) opts.push([el.name, el.value, el.defaultChecked]);
    } else if (el.type === 'checkbox') {
      opts.push([el.name, String(el.checked), el.checked === el.defaultChecked]);
    } else {
      const def = el.tagName === 'SELECT' ? ([...el.options].find(o => o.defaultSelected) ?? el.options[0]).value : el.defaultValue;
      opts.push([el.name, el.value, el.value === def]);
    }
  }
  if (custom()) opts.push(['colors', colors().map(c => c.slice(1)).join(','), false]);
  return opts;
}

function commandLine(opts) {
  const quote = v => /^[\w.\/-]+$/.test(v) ? v : `'${v}'`;
  const args = opts.filter(([, , isDefault]) => !isDefault).map(([k, v]) => `-${k}=${quote(v)}`);
  return ['automaty.cell', ...args, `-o out.${format()}`].join(' ');
}

// Query string for the options: all of them for the server, or only the
// changed ones for the page's own URL, which is then short enough to share.
function query(opts, onlyChanged) {
  const params = new URLSearchParams(opts.filter(([, , isDefault]) => !onlyChanged || !isDefault).map(([k, v]) => [k, v]));
  if (!onlyChanged || format() !== 'png') params.set('format', format());
  return params;
}

// Fill the form from [flag, value] pairs, as found in a shared URL or sent
// back by /surprise.
function applyParams(entries) {
  for (const [k, v] of entries) {
    if (k === 'format') $('format').value = v;
    else if (k === 'cyclic') form.mode.value = v === 'true' ? 'cyclic' : 'rule';
    else if (k === 'palette') { $('custom').checked = false; form.palette.value = v; }
    else if (k === 'colors') { $('custom').checked = true; setColors(v.split(',')); }
    else if (form[k]?.type === 'checkbox') form[k].checked = v === 'true';
    else if (form[k]) form[k].value = v;
  }
  const has = (select, value) => [...select.options].some(o => o.value === value);
  $('preset').value = has($('preset'), form.rule.value) ? form.rule.value : '';
  const cyc = [form.states.value, form.threshold.value, form.neighborhood.value, form.radius.value].join(',');
  $('cyclic-preset').value = has($('cyclic-preset'), cyc) ? cyc : '';
}

let controller, timer;
async function render() {
  clearTimeout(timer);
  const opts = options();
  $('cmdline').textContent = commandLine(opts);
  const own = query(opts, true);
  if (theme) own.set('theme', theme);
  if (lang) own.set('lang', lang);
  history.replaceState(null, '', '?' + own);

  controller?.abort();
  controller = new AbortController();
  $('status').textContent = T.jsRendering;
  try {
    const res = await fetch('/render?' + query(opts, false), { signal: controller.signal });
    if (!res.ok) throw new Error(await res.text());
    const url = URL.createObjectURL(await res.blob());
    URL.revokeObjectURL($('img').src);
    $('img').src = url;
    $('img').hidden = false;
    $('error').hidden = true;
    $('download').href = url;
    $('download').download = 'automaty.cell.' + format();
    $('status').textContent = '';
  } catch (err) {
    if (err.name === 'AbortError') return;
    $('img').hidden = true;
    $('error').hidden = false;
    $('error').textContent = err.message;
    $('status').textContent = '';
  }
}

async function surprise() {
  $('surprise').disabled = true;
  $('status').textContent = T.jsSearching;
  try {
    const res = await fetch('/surprise?' + query(options(), false));
    if (!res.ok) throw new Error(await res.text());
    applyParams(Object.entries(await res.json()));
    updateVisibility();
    render();
  } catch (err) {
    $('error').hidden = false;
    $('error').textContent = err.message;
    $('status').textContent = '';
  } finally {
    $('surprise').disabled = false;
  }
}

function changed() {
  updateVisibility();
  clearTimeout(timer);
  timer = setTimeout(render, 300);
}

form.addEventListener('input', changed);
form.addEventListener('submit', e => e.preventDefault());

$('preset').addEventListener('change', e => {
  if (e.target.value) form.rule.value = e.target.value;
});
form.rule.addEventListener('input', () => { $('preset').value = ''; });

$('cyclic-preset').addEventListener('change', e => {
  if (!e.target.value) return;
  const [states, threshold, neighborhood, radius] = e.target.value.split(',');
  form.states.value = states;
  form.threshold.value = threshold;
  form.neighborhood.value = neighborhood;
  form.radius.value = radius;
});
for (const name of ['states', 'threshold', 'neighborhood', 'radius']) {
  form[name].addEventListener('input', () => { $('cyclic-preset').value = ''; });
}

$('dice').addEventListener('click', () => {
  form.seed.value = Math.floor(Math.random() * 1e6);
  changed();
});
$('copy').addEventListener('click', () => navigator.clipboard.writeText($('cmdline').textContent));
$('link').addEventListener('click', () => navigator.clipboard.writeText(location.href));
$('surprise').addEventListener('click', surprise);
$('color-add').addEventListener('click', () => {
  const extra = ['#3ef3ff', '#9dff3e', '#ff8a3d', '#7b5cff', '#ffffff', '#ff3b3b'];
  setColors([...colors(), extra[colors().length % extra.length]]);
  changed();
});
$('color-remove').addEventListener('click', () => {
  setColors(colors().slice(0, -1));
  changed();
});
// Switching theme or language reloads the page; the settings are already in
// its URL. The defaults (bonbon, en) are left out of it.
for (const [id, def] of [['theme', 'bonbon'], ['lang', 'en']]) {
  $(id).addEventListener('change', e => {
    const params = new URLSearchParams(location.search);
    if (e.target.value === def) params.delete(id);
    else params.set(id, e.target.value);
    location.search = params;
  });
}

// The warning stays dismissed on later visits (when storage is available).
try { if (localStorage.getItem('automaty.cell-warning-closed')) $('warning').hidden = true; } catch {}
$('warning-ok').addEventListener('click', () => {
  $('warning').hidden = true;
  try { localStorage.setItem('automaty.cell-warning-closed', '1'); } catch {}
});

setColors(['#1a0033', '#ff3ea5', '#ffcc00']);
applyParams(new URLSearchParams(location.search));
updateVisibility();
render();
</script>
</body>
</html>
