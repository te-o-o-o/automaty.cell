name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The README badge holds the version: a tag that doesn't match it is a
      # forgotten bump.
      - run: |
          grep -qF "<sub>$GITHUB_REF_NAME · " README.md || {
            echo "::error::tag $GITHUB_REF_NAME doesn't match the version in README.md"
            exit 1
          }
      # The latest Go, not go.mod's minimum: macOS refuses to run binaries
      # from Go 1.22's linker ("missing LC_UUID").
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - run: |
          for target in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64 windows/amd64; do
            os=${target%/*} arch=${target#*/} ext=
            [ "$os" = windows ] && ext=.exe
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags=-s -o "dist/automaty.cell-$os-$arch$ext" .
          done
      - run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --notes "$NOTES"
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: |
            The binaries aren't signed:
            - **macOS**: `xattr -d com.apple.quarantine automaty.cell-darwin-*`, then `chmod +x` it.
            - **Windows**: if SmartScreen stops it, click *More info* then *Run anyway*.
            - **Linux**: `chmod +x automaty.cell-linux-*`.
