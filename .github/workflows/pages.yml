name: pages

# The web page on GitHub Pages, with the engine compiled to WebAssembly: no
# server, every render runs in the visitor's browser.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Build the site
        run: |
          go run . -site site
          GOOS=js GOARCH=wasm go build -trimpath -ldflags=-s -o site/automaty.wasm .
          # wasm_exec.js moved from misc/wasm to lib/wasm in Go 1.24.
          root=$(go env GOROOT)
          cp "$root/lib/wasm/wasm_exec.js" site/ 2>/dev/null || cp "$root/misc/wasm/wasm_exec.js" site/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
